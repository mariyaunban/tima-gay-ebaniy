<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Секретный вопрос</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #1e1e2e;
    color: white;
    font-family: sans-serif;
    overflow: hidden;
  }
  h1 { margin-bottom: 30px; }
  button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
  }
  #yes {
    background: #2ecc71;
    color: white;
    margin-right: 140px;
  }
  #no {
    background: #e74c3c;
    color: white;
    position: absolute;
    transition: 0.15s;
  }
</style>
</head>
<body>

  <h1>ты любишь меня больше чем машу??)?)?))? </h1>
  <div>
    <button id="yes" onclick="alert('Никто и не сомневался! 🔥')">Да</button>
    <button id="no">Нет</button>
  </div>

<script>
  const noBtn = document.getElementById('no');

  noBtn.addEventListener('mouseover', () => {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  });
</script>

</body>
</html>
